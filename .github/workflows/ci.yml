name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Valores de exemplo: o build só precisa que as variáveis existam,
      # não liga ao Supabase. Os valores reais estão no Vercel.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-anon-de-exemplo
          SUPABASE_SERVICE_ROLE_KEY: chave-servico-de-exemplo
